version: 1
plan:
  name: 'Milestone 1: 项目初始化'
  max_concurrency: 3
  max_consecutive_failures: 2
  max_cycles: 10
tasks:
  - id: implementation
    title: '实现 Milestone 1 项目初始化'
    prompt: |
      你是一个 hands-on 软件工程师，负责实现 Milestone 1：项目初始化。

      ## 上下文

      项目目录：C:\Users\Administrator\Desktop\MVP项目\ResearchBot
      当前分支：dev（已从 origin/dev 拉取最新）
      目标分支：milestone/1-project-init

      ## 实现计划

      参考 docs/superpowers/plans/milestone-1-project-init.md 的详细计划。

      ## 验收标准（必须全部满足才算完成）

      - npm run dev 成功启动，开发服务器可访问
      - ESLint + Prettier 已配置（pnpm lint 无报错）
      - TypeScript 编译通过（pnpm typecheck 无报错）
      - package.json scripts 完整：dev / build / lint / typecheck / test

      ## 工作步骤（按顺序执行）

      1. **创建并切换到新分支**
         从 origin/dev 创建并切换到 milestone/1-project-init 分支

      2. **初始化 Next.js 项目**
         使用 create-next-app 创建项目：
         - TypeScript
         - ESLint
         - App Router（src/app 目录结构）
         - Tailwind CSS（按需）

      3. **安装测试框架**
         - Vitest
         - @testing-library/react
         - @testing-library/jest-dom

      4. **配置 ESLint / Prettier**
         - .eslintrc.json 或 eslint.config.mjs
         - .prettierrc.json

      5. **创建目录骨架**
         按照 SPEC.md 项目结构创建以下目录和占位文件：
         ```
         src/app/
         ├── api/research/route.ts
         ├── api/research/stream/route.ts
         ├── page.tsx
         └── layout.tsx
         src/components/
         ├── ChatInput.tsx
         └── StreamOutput.tsx
         ```

      6. **验证构建**
         执行以下命令确认全部通过：
         ```bash
         pnpm lint
         pnpm typecheck
         pnpm build
         ```

      ## 约束

      - 不实现任何业务逻辑
      - 不硬编码 API 密钥
      - 保持目录结构与 SPEC.md 一致

      ## 提交

      完成后提交：
      ```
      chore: milestone 1 - project initialization
      ```

      并将 milestone/1-project-init 分支推送到 origin。

      报告：完成的文件列表、最终验证命令输出。

    assigned_to: coder
    verified_by: verifier
    verify_prompt: |
      你是审查者，负责验证 Milestone 1 的实现是否符合验收标准。

      ## 验证步骤

      1. 确认 milestone/1-project-init 分支存在且从 dev 切出
      2. 运行以下命令验证：
         ```bash
         pnpm install
         pnpm lint
         pnpm typecheck
         pnpm build
         ```
      3. 确认目录结构符合 SPEC.md：
         - src/app/api/research/route.ts
         - src/app/api/research/stream/route.ts
         - src/app/page.tsx
         - src/app/layout.tsx
         - src/components/ChatInput.tsx
         - src/components/StreamOutput.tsx
      4. 确认 package.json 包含：dev / build / lint / typecheck / test scripts

      ## 通过条件

      - 所有命令执行成功（退出码 0）
      - 目录结构与 SPEC.md 一致
      - 没有缺失文件

      如果发现问题，FAIL 并列出具体问题。
    timeout_ms: 1800000

  - id: bugfix
    title: '修复 Milestone 1 测试问题'
    prompt: |
      你是一个软件调试专家，负责修复 Milestone 1 实现过程中出现的任何测试/构建问题。

      ## 上下文

      项目目录：C:\Users\Administrator\Desktop\MVP项目\ResearchBot
      当前分支：milestone/1-project-init

      ## 工作方式

      1. 加载 systematic-debugging skill
      2. 运行以下验证命令，检查是否有错误：
         ```bash
         pnpm lint
         pnpm typecheck
         pnpm build
         ```
      3. 如果有任何错误，从 milestone/1-project-init 切出新分支 milestone/1-project-init-fix
      4. 诊断并修复问题
      5. 验证修复后的构建
      6. 提交并推送修复

      ## 约束

      - 只修复问题，不添加新功能
      - 修复后必须通过所有验证命令

      报告：发现的问题、修复方法、最终验证结果。
    assigned_to: general
    depends_on: [implementation]
    verified_by: verifier
    verify_prompt: |
      你是审查者，负责验证 bugfix 任务是否成功修复了问题。

      切换到 milestone/1-project-init-fix 分支（如存在），或确认 milestone/1-project-init 分支构建无错误。

      运行：
      ```bash
      pnpm lint
      pnpm typecheck
      pnpm build
      ```

      如果所有命令通过，PASS。
      如果仍有问题，FAIL 并列出具体问题。
    timeout_ms: 1800000
